[package]
name = "vigil-collector"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Chris Rowles <christopher.rowles@outlook.com>"]
license = "MIT"
description = "Vigil Collector — a lightweight system and network monitoring server."
readme = "README.md"
repository = "https://github.com/sentrychris/vigil-collector"
keywords = ["monitoring", "system", "network", "websocket"]
categories = ["command-line-utilities"]

[[bin]]
name = "vigil-collector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "signal", "time", "sync", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
tower-http = { version = "0.7", features = ["cors"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
# ``rustls-no-provider`` + ring keeps the TLS stack pure Rust plus a small C
# shim: aws-lc (reqwest's default provider) needs CMake/NASM to build on
# Windows, ring only needs the MSVC toolchain that rustup already requires.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
arc-swap = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "network", "system", "user"] }
dirs = "7"
whoami = "2"
anyhow = "1"
rust-embed = { version = "8", features = ["mime-guess"] }
base64 = "0.23"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Temperature sensors. Not enabled on Windows: sysinfo reads them there via
# a WMI query that needs admin rights and reports an ACPI zone rather than
# the CPU package, so Windows reports ``0`` (see metrics/cpu.rs).
sysinfo = { version = "0.40", default-features = false, features = ["component"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
