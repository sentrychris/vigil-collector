[package]
name = "vigil-collector"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Chris Rowles <christopher.rowles@outlook.com>"]
license = "MIT"
description = "Vigil — a system monitoring utility with remote connection capabilities."
readme = "README.md"
repository = "https://github.com/sentrychris/vigil-collector"
keywords = ["monitoring", "system", "network", "websocket"]
categories = ["command-line-utilities"]

[[bin]]
name = "vigil-collector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "signal", "time", "sync", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws", "json"] }
tower-http = { version = "0.7", features = ["cors"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
# ``rustls-no-provider`` + ring keeps the TLS stack pure Rust plus a small C
# shim: aws-lc (reqwest's default provider) needs CMake/NASM to build on
# Windows, ring only needs the MSVC toolchain that rustup already requires.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
arc-swap = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "network", "system", "user"] }
dirs = "7"
whoami = "2"
anyhow = "1"
rust-embed = { version = "8", features = ["mime-guess"] }
base64 = "0.23"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Temperature sensors. Not enabled on Windows: sysinfo reads them there via
# a WMI query that needs admin rights and reports an ACPI zone rather than
# the CPU package; metrics/temp_windows.rs has its own sources instead.
sysinfo = { version = "0.40", default-features = false, features = ["component"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# LibreHardwareMonitor's sensors, read through its WMI namespace.
wmi = { version = "0.18", default-features = false }
# The Vigil window: a WebView2 control inside a window the tray thread
# makes itself (window.rs). WebView2 is part of Windows 11 and comes to
# Windows 10 through Windows Update, so there is nothing to ship. MinGW
# builds compile it but leave it out (see the window-on-mingw feature).
wry = { version = "0.57", default-features = false }
# Vigil's own windows (src/native/): the compact dashboard and Settings,
# drawn without a browser. Slint lays them out and paints them on the
# processor into windows the tray thread makes itself. No windowing
# backend and no graphics stack are pulled in, only the software renderer.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }

# The windows' layouts are tested on every platform, though only Windows
# opens them.
[dev-dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
# Writes the previews that ``cargo test`` can leave behind (see the
# README's "Development").
png = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Slint's text layout asks the system for fonts through fontconfig. The
# tests carry their own fonts, so this only says to look for the library
# when a test runs instead of when it is built: ``cargo test`` then needs
# no fontconfig headers installed. Keep the version the one Slint uses.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[build-dependencies]
# Turns ui/*.slint into the Rust Vigil's own windows are built from.
slint-build = "1.18"

[features]
# MinGW builds (x86_64-pc-windows-gnu) leave the Vigil window out, because
# there the WebView2 loader can only be linked as WebView2Loader.dll, which
# would then have to sit beside the .exe for it to start at all. MSVC
# builds link the loader in and always have the window. This feature puts
# the window in a MinGW build too, for those happy to ship the DLL.
window-on-mingw = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
