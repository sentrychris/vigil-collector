[package]
name = "vigil-collector"
version = "1.0.0"
edition = "2021"
authors = ["Chris Rowles <christopher.rowles@outlook.com>"]
license = "MIT"
description = "Vigil Collector — a lightweight system and network monitoring server."
readme = "README.md"
repository = "https://github.com/sentrychris/vigil-collector-rs"
keywords = ["monitoring", "system", "network", "websocket"]
categories = ["command-line-utilities"]

[[bin]]
name = "vigil-collector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "sync", "net", "io-util"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
arc-swap = "1"
sysinfo = { version = "0.32", default-features = false, features = ["component", "disk", "network", "system", "user"] }
dirs = "5"
gethostname = "0.5"
whoami = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
base64 = "0.22"
rand = "0.8"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
